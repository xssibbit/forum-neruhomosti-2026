name: Direct final hero publish

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put final hero CSS last in head
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove any old direct final-hero link and JS loader.
          s = re.sub(r'\s*<link[^>]+href=["\']hero-reference-final\.css[^"\']*["\'][^>]*>\s*', '\n', s)
          s = re.sub(r'\s*<script[^>]+src=["\']hero-reference-final\.js[^"\']*["\'][^>]*></script>\s*', '\n', s)

          # Insert the final hero stylesheet as the very last stylesheet in the head.
          link = '  <link rel="stylesheet" href="hero-reference-final.css?v=20260904-direct2">\n'
          s = s.replace('</head>', link + '</head>')

          # Force the hero image preload to the same fresh cache key.
          s = re.sub(r'assets/hero-main\.jpg\?v=[^"\']+', 'assets/hero-main.jpg?v=20260904-direct2', s)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Load exact reference hero last in head"
            git push
          fi
