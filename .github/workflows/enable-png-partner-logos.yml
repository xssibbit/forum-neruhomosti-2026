name: Enable user PNG partner logos

on:
  push:
    paths:
      - '.github/workflows/enable-png-partner-logos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach partner logo stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '  <link rel="stylesheet" href="partner-logos.css?v=user-png-final-1">\n'
          if 'partner-logos.css' not in s:
              anchor = '  <link rel="stylesheet" href="live-match.css?v=20260903-final">\n'
              if anchor in s:
                  s = s.replace(anchor, anchor + link, 1)
              else:
                  s = s.replace('</head>', link + '</head>', 1)
          p.write_text(s)
          assert 'partner-logos.css' in s
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load user PNG partner logos' || exit 0
          git push
