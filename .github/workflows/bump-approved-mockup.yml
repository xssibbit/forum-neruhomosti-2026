name: Publish approved mockup

on:
  push:
    paths:
      - '.github/workflows/bump-approved-mockup.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump final hero cache and preload user artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('hero-simple.css?v=20260904-simple5', 'hero-simple.css?v=20260904-mockup1')
          s = s.replace('assets/hero-forum-main.webp?v=20260904-1605', 'assets/hero-main.jpg?v=20260904-mockup1')
          p.write_text(s)
          PY
          rm .github/workflows/bump-approved-mockup.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/bump-approved-mockup.yml
          git commit -m 'Publish approved hero and about mockup' || exit 0
          git push
