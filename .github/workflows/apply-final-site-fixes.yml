name: Apply final site fixes
on:
  push:
    paths:
      - '.github/workflows/apply-final-site-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch landing page and copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('participants-main.css?v=20260904-hero4','participants-main.css?v=20260904-wayforpay1')
          s = s.replace('tz-enhancements.js?v=20260903-final','tz-enhancements.js?v=20260904-wayforpay1')
          s = s.replace('<h2 class="section-title reveal">25–26 вересня.<br><span>Повна програма.</span></h2>','<h2 class="section-title reveal">Повна програма</h2>')
          s = s.replace('Практика, угоди,<br><span>маркетинг і право.</span>','Практика, угоди,<br><span>маркетинг і право</span>')
          # Add legal links visibly in footer if absent.
          if 'href="terms.html"' not in s:
              s = s.replace('<div class="footer-links">','<div class="footer-links"><a href="terms.html">Правила і умови</a><a href="refund.html">Повернення коштів</a>')
          p.write_text(s)

          p = Path('tz-enhancements.js')
          s = p.read_text()
          s = s.replace("link.href = 'participants-main.css?v=20260904-hero4';", "link.href = 'participants-main.css?v=20260904-wayforpay1';")
          s = s.replace("link.href = 'participants-main.css?v=20260903-2';", "link.href = 'participants-main.css?v=20260904-wayforpay1';")
          s = s.replace("'Що залишиться<br><span>після форуму.</span>'", "'Що залишиться<br><span>після форуму</span>'")
          s = s.replace("'Не відкладайте<br><span>рішення.</span>'", "'Не відкладайте<br><span>рішення</span>'")
          # Ensure actual hero artwork element exists; CSS background remains fallback.
          marker = "// Hero copy from the customer TZ."
          if "hero-artwork" not in s:
              insert = '''// Guaranteed visible hero artwork.\n  const hero = $('.hero');\n  if (hero && !$('.hero-artwork', hero)) {\n    const artwork = document.createElement('div');\n    artwork.className = 'hero-artwork';\n    artwork.innerHTML = '<img src="assets/hero-forum-main.webp?v=20260904-final" alt="Вінницьке регіональне відділення АФНУ та DIM.RIA — перевірений партнер">';\n    hero.prepend(artwork);\n  }\n\n  '''
              s = s.replace(marker, insert + marker)
          # Add legal footer links dynamically as a fallback.
          footer_marker = "const footerLinks = $('.footer-links');\n  if (footerLinks) {"
          replacement = footer_marker + "\n    if (!footerLinks.querySelector('a[href=\"terms.html\"]')) footerLinks.insertAdjacentHTML('beforeend','<a href=\"terms.html\">Правила і умови</a><a href=\"refund.html\">Повернення коштів</a>');"
          s = s.replace(footer_marker, replacement)
          p.write_text(s)
          PY
      - name: Add hero artwork element styles
        run: |
          cat >> site-final-fixes.css <<'CSS'

          /* Real DOM artwork so the approved image cannot disappear behind pseudo-elements. */
          html body .hero-artwork{
            position:absolute!important;z-index:1!important;top:0!important;right:0!important;bottom:0!important;width:62%!important;
            display:flex!important;align-items:center!important;justify-content:flex-end!important;overflow:hidden!important;background:#fff!important;pointer-events:none!important;
          }
          html body .hero-artwork img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:right center!important;background:#fff!important}
          html body .hero-artwork::before{
            content:""!important;position:absolute!important;z-index:2!important;inset:0!important;pointer-events:none!important;
            background:linear-gradient(90deg,#052a23 0%,rgba(5,42,35,.98) 13%,rgba(5,42,35,.84) 25%,rgba(5,42,35,.52) 38%,rgba(5,42,35,.20) 49%,rgba(5,42,35,0) 59%)!important;
          }
          @media(max-width:760px){
            html body .hero-artwork{top:auto!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;height:520px!important;align-items:flex-end!important}
            html body .hero-artwork img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center bottom!important}
            html body .hero-artwork::before{background:linear-gradient(180deg,#052720 0%,rgba(5,39,32,.95) 8%,rgba(5,39,32,.68) 17%,rgba(5,39,32,.22) 26%,rgba(5,39,32,0) 34%)!important}
          }
          CSS
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-final-site-fixes.yml
          git config user.name "xssibbit"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tz-enhancements.js site-final-fixes.css .github/workflows/apply-final-site-fixes.yml
          git commit -m "Apply final hero, headings and WayForPay policy links"
          git push
