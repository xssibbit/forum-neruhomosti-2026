name: Apply hero title spacing

on:
  push:
    paths:
      - '.github/workflows/apply-hero-spacing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump hero stylesheet version
        run: |
          sed -i 's/hero-simple.css?v=20260904-simple1/hero-simple.css?v=20260904-simple2/g' index.html
          rm .github/workflows/apply-hero-spacing.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-hero-spacing.yml
          git commit -m 'Tighten Forum title spacing' || exit 0
          git push
