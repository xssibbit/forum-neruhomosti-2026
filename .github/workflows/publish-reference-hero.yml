name: Publish exact reference hero

on:
  push:

permissions:
  contents: write

jobs:
  bump-reference-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh hero CSS and JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260904-reference2'

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          if re.search(r'<link[^>]+href=["\']participants-main\.css\?v=[^"\']+["\']', text):
              text = re.sub(r'participants-main\.css\?v=[^"\']+', f'participants-main.css?v={version}', text)
          else:
              text = text.replace('</head>', f'  <link rel="stylesheet" href="participants-main.css?v={version}">\n</head>')

          text = re.sub(r'tz-enhancements\.js\?v=[^"\']+', f'tz-enhancements.js?v={version}', text)
          index.write_text(text, encoding='utf-8')

          tz = Path('tz-enhancements.js')
          js = tz.read_text(encoding='utf-8')
          js = re.sub(r"participants-main\.css\?v=[^'\"]+", f'participants-main.css?v={version}', js)
          tz.write_text(js, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tz-enhancements.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish exact reference hero"
            git push
          fi
