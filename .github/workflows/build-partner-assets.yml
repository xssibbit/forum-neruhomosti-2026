name: Build transparent partner assets

on:
  push:
    paths:
      - '.github/workflows/build-partner-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare images
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p assets
          curl -L --fail 'https://forumneruhomosti.com.ua/wp-content/uploads/2026/08/logo_1.png' -o /tmp/afnu.png
          curl -L --fail 'https://forumneruhomosti.com.ua/wp-content/uploads/2026/08/rio-logo.webp' -o /tmp/dimria.webp
          python3 - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path

          def clean(src, dst):
              im = Image.open(src).convert('RGBA')
              w,h = im.size
              px = im.load()
              # remove background connected to canvas edges using edge color tolerance
              corners = [px[0,0][:3], px[w-1,0][:3], px[0,h-1][:3], px[w-1,h-1][:3]]
              bg = tuple(sum(c[i] for c in corners)//4 for i in range(3))
              seen=set(); q=deque()
              def near_bg(x,y):
                  r,g,b,_ = px[x,y]
                  return ((r-bg[0])**2+(g-bg[1])**2+(b-bg[2])**2) ** 0.5 < 42
              for x in range(w):
                  for y in (0,h-1):
                      if near_bg(x,y): q.append((x,y)); seen.add((x,y))
              for y in range(h):
                  for x in (0,w-1):
                      if near_bg(x,y) and (x,y) not in seen: q.append((x,y)); seen.add((x,y))
              while q:
                  x,y=q.popleft(); r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0)
                  for nx,ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1)):
                      if 0<=nx<w and 0<=ny<h and (nx,ny) not in seen and near_bg(nx,ny):
                          seen.add((nx,ny)); q.append((nx,ny))
              # remove only very large near-white connected components (panel backgrounds), preserve small white logo details
              mask=set()
              for y in range(h):
                  for x in range(w):
                      r,g,b,a=px[x,y]
                      if a and r>238 and g>238 and b>238 and max(r,g,b)-min(r,g,b)<14:
                          mask.add((x,y))
              visited=set(); threshold=max(100, int(w*h*0.012))
              for seed in list(mask):
                  if seed in visited: continue
                  comp=[]; dq=deque([seed]); visited.add(seed)
                  while dq:
                      p=dq.popleft(); comp.append(p); x,y=p
                      for n in ((x+1,y),(x-1,y),(x,y+1),(x,y-1)):
                          if n in mask and n not in visited:
                              visited.add(n); dq.append(n)
                  if len(comp)>=threshold:
                      for x,y in comp:
                          r,g,b,a=px[x,y]; px[x,y]=(r,g,b,0)
              bbox = im.getbbox()
              if bbox: im = im.crop(bbox)
              pad=max(8,int(max(im.size)*.035))
              out=Image.new('RGBA',(im.width+pad*2,im.height+pad*2),(0,0,0,0))
              out.paste(im,(pad,pad),im)
              out.save(dst,'PNG',optimize=True)

          clean('/tmp/afnu.png','assets/afnu-vinnytsia-transparent.png')
          clean('/tmp/dimria.webp','assets/dimria-transparent.png')
          PY
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/afnu-vinnytsia-transparent.png assets/dimria-transparent.png
          git commit -m 'Add transparent Vinnytsia AFNU and DIM.RIA logos' || exit 0
          git push
