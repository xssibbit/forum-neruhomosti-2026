name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore participant list on landing page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          seed = '<script src="participants-data.js?v=20260903-main2"></script>'
          marker = '<script src="tz-enhancements.js?v=20260903-final"></script>'
          css = '<link rel="stylesheet" href="participants-return.css?v=20260903-main3">'
          adjust = '<script src="ticket-date-adjustments.js?v=20260903-1"></script>'
          countdown = '<link rel="stylesheet" href="countdown-classic.css?v=20260903-2">'
          if seed not in s and marker in s:
              s = s.replace(marker, seed + '\n  ' + marker + '\n  ' + css)
          elif css not in s:
              s = s.replace('</body>', '  ' + css + '\n</body>')
          if adjust not in s:
              s = s.replace('</body>', '  ' + adjust + '\n</body>')
          if countdown not in s:
              s = s.replace('</body>', '  ' + countdown + '\n</body>')
          p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
