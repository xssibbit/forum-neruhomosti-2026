name: Capture published site source

on:
  push:
    paths:
      - '.github/workflows/capture-live.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published site
        run: |
          curl -L --fail --retry 3 'https://forum-neruhomosti-2026.xsibitt.chatgpt.site/' -o live-source.html
          wc -c live-source.html
          head -c 500 live-source.html
      - name: Commit captured source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-source.html
          git commit -m 'Capture current published site source' || exit 0
          git push
