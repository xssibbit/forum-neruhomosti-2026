name: Apply hero visibility polish

on:
  push:
    paths:
      - '.github/workflows/apply-hero-visibility.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make poster and CTA labels unambiguous
        run: |
          cat >> hero-simple.css <<'EOF'

/* Final visibility polish: show the whole poster, with only a light overlap gradient. */
@media(min-width:761px){
  html body .hero-artwork{width:59%!important}
  html body .hero-artwork::before{
    width:18%!important;
    background:linear-gradient(90deg,#052a23 0%,rgba(5,42,35,.86) 30%,rgba(5,42,35,.38) 68%,rgba(5,42,35,0) 100%)!important;
  }
}
html body .hero .hero-actions .button.primary::before,
html body .hero .hero-actions .button.ghost::before{
  position:static!important;
  inset:auto!important;
  width:auto!important;
  height:auto!important;
  background:none!important;
  opacity:1!important;
  transform:none!important;
}
EOF
          sed -i 's/hero-simple.css?v=20260904-simple3/hero-simple.css?v=20260904-simple4/g' index.html
          rm .github/workflows/apply-hero-visibility.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hero-simple.css .github/workflows/apply-hero-visibility.yml
          git commit -m 'Improve poster visibility on hero' || exit 0
          git push
