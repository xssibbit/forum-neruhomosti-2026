name: Create dedicated participants page

on:
  push:
    paths:
      - '.github/workflows/split-participants.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build participants page
        run: python3 split_participants_page.py
      - name: Verify
        run: |
          test -f participants.html
          grep -q 'href="participants.html"' index.html
          grep -q 'Зареєстровані учасники' participants.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html participants.html
          git commit -m 'Move participant registration to dedicated page' || exit 0
          git push
