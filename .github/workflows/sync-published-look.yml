name: Sync published premium look

on:
  push:
    paths:
      - '.github/workflows/sync-published-look.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore premium base and apply current changes
        run: python3 sync_site.py
      - name: Verify output
        run: |
          grep -q 'live-match.css' index.html
          grep -q 'id="participants"' index.html
          grep -q 'РЕЄСТРАЦІЯ УЧАСНИКІВ' index.html
      - name: Commit synchronized site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match published premium forum design' || exit 0
          git push
