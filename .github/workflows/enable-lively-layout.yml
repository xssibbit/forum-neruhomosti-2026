name: Enable lively layout

on:
  push:
    paths:
      - '.github/workflows/enable-lively-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load lively styles last
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          link='  <link rel="stylesheet" href="lively-layout.css?v=20260903-1">\n'
          if 'lively-layout.css' not in s:
              anchor='  <link rel="stylesheet" href="clean-layout.css?v=20260903-clean-1">\n'
              if anchor in s:
                  s=s.replace(anchor,anchor+link,1)
              else:
                  s=s.replace('</head>',link+'</head>',1)
          p.write_text(s)
          assert 'lively-layout.css' in s
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable lively accents and centered registration' || exit 0
          git push
