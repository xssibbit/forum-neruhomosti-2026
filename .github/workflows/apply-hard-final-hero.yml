name: Apply hard final hero

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy hero with isolated reference hero
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          hero = '''    <section class="hero ref-hero" aria-labelledby="ref-hero-title">
      <div class="ref-hero-left">
        <div class="ref-hero-star" aria-hidden="true">✦</div>
        <div class="ref-hero-date"><strong>25–26</strong><span>ВЕРЕСНЯ · ВІННИЦЯ</span></div>
        <h1 class="ref-hero-title" id="ref-hero-title"><span>ФОРУМ</span><em>НЕРУХОМОСТІ</em></h1>
        <p class="ref-hero-desc">Два дні практики, кейсів, нетворкінгу та майстер-класів від провідних експертів ринку нерухомості.</p>
        <div class="ref-hero-venue"><span class="ref-hero-pin" aria-hidden="true"></span><div><b>Місце проведення заходу:</b>готельно-ресторанний комплекс «Mont Blanc», Hotel France · вул. Соборна, 34 · Вінниця</div></div>
        <div class="ref-hero-actions">
          <a class="ref-hero-btn primary" href="#tickets">КУПИТИ КВИТОК <i>◇</i></a>
          <a class="ref-hero-btn secondary" href="#participants">БРОНЮВАННЯ МІСЦЯ <i>▣</i></a>
        </div>
      </div>
      <div class="ref-hero-visual" aria-hidden="true"><img src="assets/hero-main.jpg?v=20260904-hardfinal1" alt=""></div>
      <div class="ref-hero-blend" aria-hidden="true"></div>
    </section>'''

          s, n = re.subn(r'    <section class="hero(?:[^\"]*)">.*?    </section>', hero, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Hero replacement failed: {n}')

          # Remove any older final hero loaders/links to prevent confusion.
          s = re.sub(r'\s*<link[^>]+href=["\']hero-reference-final\.css[^"\']*["\'][^>]*>\s*', '\n', s)
          s = re.sub(r'\s*<script[^>]+src=["\']hero-reference-final\.js[^"\']*["\'][^>]*></script>\s*', '\n', s)
          s = re.sub(r'\s*<link[^>]+href=["\']hero-hard-final\.css[^"\']*["\'][^>]*>\s*', '\n', s)
          s = s.replace('</head>', '  <link rel="stylesheet" href="hero-hard-final.css?v=20260904-hardfinal1">\n</head>')
          s = re.sub(r'assets/hero-main\.jpg\?v=[^"\']+', 'assets/hero-main.jpg?v=20260904-hardfinal1', s)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Replace landing hero with exact isolated reference layout"
            git push
          fi
