name: Apply about stickers

on:
  push:
    paths:
      - '.github/workflows/apply-about-stickers.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump landing stylesheet version
        run: |
          sed -i 's/participants-main.css?v=20260904-wayforpay1/participants-main.css?v=20260904-stickers1/g' index.html
          rm .github/workflows/apply-about-stickers.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-about-stickers.yml
          git commit -m 'Show topic stickers on landing page' || exit 0
          git push
