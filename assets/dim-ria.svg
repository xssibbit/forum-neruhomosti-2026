    <linearGradient id="navy" x1="0" x2="1"><stop stop-color="#0D3D67"/><stop offset="1" stop-color="#062D4D"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".2"/></filter>
