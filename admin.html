<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Адмін-панель · Форум нерухомості 2026</title>
  <link rel="stylesheet" href="admin.css?v=20260903-1">
</head>
<body>
  <main class="admin-shell">
    <section class="login-screen" id="login-screen">
      <div class="login-card">
        <div class="eyebrow">FORUM 2026 · ADMIN</div>
        <h1>Панель<br><span>реєстрацій</span></h1>
        <p>Доступ лише для організаторів форуму.</p>
        <form id="login-form">
          <label>Пароль адміністратора
            <input id="admin-key" type="password" autocomplete="current-password" required placeholder="Введіть пароль">
          </label>
          <button type="submit">Увійти</button>
          <p class="status" id="login-status"></p>
        </form>
      </div>
    </section>

    <section class="dashboard" id="dashboard" hidden>
      <header class="admin-header">
        <div>
          <div class="eyebrow">ФОРУМ НЕРУХОМОСТІ · 2026</div>
          <h1>Реєстрації</h1>
        </div>
        <div class="header-actions">
          <a href="index.html" target="_blank" rel="noopener">Відкрити сайт ↗</a>
          <button id="logout-btn" class="ghost">Вийти</button>
        </div>
      </header>

      <section class="stats-grid">
        <article><span>Усього учасників</span><strong id="stat-total">0</strong></article>
        <article><span>Через сайт</span><strong id="stat-web">0</strong></article>
        <article><span>Додано вручну</span><strong id="stat-manual">0</strong></article>
      </section>

      <section class="toolbar">
        <label class="search-box">
          <span>Пошук за ПІБ</span>
          <input id="search" type="search" autocomplete="off" placeholder="Наприклад: Поліщук Галина">
        </label>
        <label>
          <span>Місто</span>
          <select id="city-filter"><option value="">Усі міста</option></select>
        </label>
        <label>
          <span>Агентство</span>
          <select id="agency-filter"><option value="">Усі агентства</option></select>
        </label>
        <button id="export-btn" class="export">Експорт CSV</button>
      </section>

      <section class="table-card">
        <div class="table-headline">
          <div><strong id="result-title">Учасники</strong><span id="result-note">Завантаження…</span></div>
          <button id="refresh-btn" class="ghost">Оновити</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>№</th><th>ПІБ</th><th>Агентство / компанія</th><th>Місто</th><th>Дата</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty" id="empty" hidden>За цими параметрами нічого не знайдено.</div>
        <footer class="pagination">
          <button id="prev-btn" class="ghost">← Назад</button>
          <span id="page-label">1 / 1</span>
          <button id="next-btn" class="ghost">Далі →</button>
        </footer>
      </section>
    </section>
  </main>
  <script src="admin.js?v=20260903-1"></script>
</body>
</html>
